  <main class="content">
    <p class="eyebrow">
      <span class="eyebrow-line"><span class="bit">Canary Islands&nbsp;·</span> <span class="bit">28 Nov&nbsp;·</span> <span class="bit">6:35 PM</span></span>
    </p>

    <h1 class="headline">
      Until I see you,
      <span class="name">Summer</span>
    </h1>

    <div class="countdown" id="countdown" role="timer" aria-live="polite">
      <div class="unit">
        <span class="value" id="days">--</span>
        <span class="label">days</span>
      </div>
      <span class="sep">·</span>
      <div class="unit">
        <span class="value" id="hours">--</span>
        <span class="label">hours</span>
      </div>
      <span class="sep">·</span>
      <div class="unit">
        <span class="value" id="minutes">--</span>
        <span class="label">minutes</span>
      </div>
      <span class="sep">·</span>
      <div class="unit">
        <span class="value" id="seconds">--</span>
        <span class="label">seconds</span>
      </div>
    </div>

    <p class="footnote" id="footnote">Every hour, closer to you.</p>
  </main>

  <button id="audio-toggle" class="audio-toggle" type="button" aria-label="Play music" disabled>
    <svg class="icon icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

    </svg>
    <svg class="icon icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
