<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Until Summer</title>
  <meta name="description" content="A countdown to the Canary Islands." />
  <meta name="theme-color" content="#2a1438" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ffc781'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff1cf'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="stars" id="stars">
      <span class="star-layer sl1"></span>
      <span class="star-layer sl2"></span>
      <span class="star-layer sl3"></span>
    </div>
    <div class="sun"></div>
    <div class="sun-glow"></div>
    <div class="clouds" aria-hidden="true">
      <div class="cloud c1">
        <span class="puff p1"></span>
        <span class="puff p2"></span>
        <span class="puff p3"></span>
        <span class="puff base"></span>
      </div>
      <div class="cloud c2">
        <span class="puff p1"></span>
        <span class="puff p2"></span>
        <span class="puff p3"></span>
        <span class="puff base"></span>
      </div>
    </div>
    <svg class="horizon" viewBox="0 0 1440 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="islandFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#241036" stop-opacity="0.93" />
          <stop offset="55%" stop-color="#180925" stop-opacity="0.97" />
          <stop offset="100%" stop-color="#0d0418" stop-opacity="1" />
        </linearGradient>
      </defs>
      <path d="M0,220 L0,150 C 120,120 200,80 320,95 C 430,108 500,150 620,140 C 720,132 780,90 880,100 C 980,110 1040,160 1160,150 C 1270,140 1340,110 1440,130 L1440,220 Z" />
    </svg>
    <div class="flock" id="flock" aria-hidden="true">
      <span class="bird b1">
        <svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path class="w wl" d="M12 7C9.2 2.6 6.4 2.2 2 4.6" />
          <path class="w wr" d="M12 7c2.8-4.4 5.6-4.8 10-2.4" />
        </svg>
      </span>
      <span class="bird b2">
        <svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path class="w wl" d="M12 7C9.2 2.6 6.4 2.2 2 4.6" />
          <path class="w wr" d="M12 7c2.8-4.4 5.6-4.8 10-2.4" />
        </svg>
      </span>
      <span class="bird b3">
        <svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path class="w wl" d="M12 7C9.2 2.6 6.4 2.2 2 4.6" />
          <path class="w wr" d="M12 7c2.8-4.4 5.6-4.8 10-2.4" />
        </svg>
      </span>
      <span class="bird b4">
        <svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path class="w wl" d="M12 7C9.2 2.6 6.4 2.2 2 4.6" />
          <path class="w wr" d="M12 7c2.8-4.4 5.6-4.8 10-2.4" />
        </svg>
      </span>
      <span class="bird b5">
        <svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path class="w wl" d="M12 7C9.2 2.6 6.4 2.2 2 4.6" />
          <path class="w wr" d="M12 7c2.8-4.4 5.6-4.8 10-2.4" />
        </svg>
      </span>
    </div>
    <div class="ocean"></div>
  </div>

  <main class="content">
    <p class="eyebrow">
      <span class="eyebrow-line"><span class="bit">Canary Islands&nbsp;·</span> <span class="bit">28 Nov&nbsp;·</span> <span class="bit">6:35 PM</span></span>
    </p>

    <h1 class="headline">
      Until I see you,
      <span class="name">Summer</span>
    </h1>

    <div class="countdown" id="countdown" role="timer" aria-live="polite">
      <div class="unit">
        <span class="value" id="days">--</span>
        <span class="label">days</span>
      </div>
      <span class="sep">·</span>
      <div class="unit">
        <span class="value" id="hours">--</span>
        <span class="label">hours</span>
      </div>
      <span class="sep">·</span>
      <div class="unit">
        <span class="value" id="minutes">--</span>
        <span class="label">minutes</span>
      </div>
      <span class="sep">·</span>
      <div class="unit">
        <span class="value" id="seconds">--</span>
        <span class="label">seconds</span>
      </div>
    </div>

    <p class="footnote" id="footnote">Every hour, closer to you.</p>
  </main>

  <button id="audio-toggle" class="audio-toggle" type="button" aria-label="Play music" disabled>
    <svg class="icon icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 3v10.55a4 4 0 1 0 2 3.45V7h4V3h-6z"/>
    </svg>
    <svg class="icon icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
    </svg>
    <span class="audio-pulse" aria-hidden="true"></span>
  </button>
  <div id="ytplayer" aria-hidden="true"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
</body>
</html>
